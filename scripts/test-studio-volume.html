<!doctype html>
<meta charset="utf-8">
<title>Studio volume regression</title>
<!-- From the repo root, serve with python3 -m http.server and open /scripts/test-studio-volume.html. -->
<pre id="result">Running…</pre>
<script type="module">
// Exercise the shipped page's controls. OfflineAudioContext cannot reach a speaker.
async function openStudio(savedVolume, session = 'focus-40-pink') {
  localStorage.setItem('entrain.session', session);
  if (savedVolume === null) localStorage.removeItem('entrain.vol');
  else localStorage.setItem('entrain.vol', savedVolume);
  const frame = document.createElement('iframe');
  frame.hidden = true;
  const loaded = new Promise(resolve => frame.onload = resolve);
  frame.src = '../site/studio/';
  document.body.append(frame);
  await loaded;
  const win = frame.contentWindow;
  let context, master, rendering, suspendCalls = 0, cueDisconnects = 0;
  const gainEvents = [], cueHits = [];
  win.AudioContext = class extends win.OfflineAudioContext {
    constructor() {
      super(2, 66150, 44100);
      context = this;
    }
    // Only startRendering() advances the offline clock.
    resume() { return Promise.resolve(); }
    suspend() { suspendCalls++; return Promise.resolve(); }
    createBufferSource() {
      const node = super.createBufferSource(), start = node.start.bind(node), disconnect = node.disconnect.bind(node);
      node.disconnect = (...args) => {
        if (node.buffer?.duration === 10) cueDisconnects++;
        return disconnect(...args);
      };
      node.start = (...args) => {
        if (node.buffer?.duration === 10) cueHits.push(args);
        return start(...args);
      };
      return node;
    }
    createGain() {
      const node = super.createGain();
      if (!master) {
        master = node;
        for (const method of ['cancelScheduledValues', 'setValueAtTime', 'setTargetAtTime', 'linearRampToValueAtTime']) {
          const schedule = master.gain[method].bind(master.gain);
          master.gain[method] = (...args) => {
            gainEvents.push({method, value: args[0]});
            return schedule(...args);
          };
        }
      }
      return node;
    }
  };
  const slider = win.document.querySelector('#volume');
  return {
    document: win.document,
    cueHits,
    cueDisconnects: () => cueDisconnects,
    playPause: () => win.document.querySelector('#play-btn').click(),
    level(percent) {
      slider.value = percent;
      slider.dispatchEvent(new win.Event('input'));
    },
    gainEvents,
    gain: () => master.gain.value,
    suspensions: () => suspendCalls,
    render: () => rendering ??= context.startRendering(),
    async advanceAudio(to) {
      const paused = win.OfflineAudioContext.prototype.suspend.call(context, to);
      if (rendering) await win.OfflineAudioContext.prototype.resume.call(context);
      else rendering = context.startRendering();
      await paused;
    },
    controlTimers() {
      // Move the wall clock independently of the offline audio clock.
      let wallTime = 0, id = 0;
      const timers = new Map();
      win.setTimeout = (fn, delay) => {
        timers.set(++id, {fn, at: wallTime + delay});
        return id;
      };
      win.clearTimeout = timer => timers.delete(timer);
      return newTime => {
        wallTime = newTime;
        for (const [timer, {fn, at}] of timers) {
          if (at <= wallTime) { timers.delete(timer); fn(); }
        }
      };
    },
    close: () => frame.remove(),
  };
}

function expectGain(actual, expected, label) {
  if (!Number.isFinite(actual) || Math.abs(actual - expected) > 1e-6)
    throw new Error(label + ': expected ' + expected + ', got ' + actual);
}
const keys = ['entrain.vol', 'entrain.session', 'entrain.cue', 'entrain.duration', 'entrain.cueVolume', 'entrain.cueInterval', 'entrain.sections', 'entrain.background', 'entrain.seed', 'entrain.lengthChoice', 'entrain.sourceDocument.v1'];
const saved = new Map(keys.map(k => [k, localStorage.getItem(k)]));
try {
  for (const key of keys) localStorage.removeItem(key);
  const studio = await openStudio(null);
  studio.playPause();
  expectGain(studio.gainEvents.at(-1).value, 0.9 * 0.7 ** 1.6, 'first play at default 70%');
  studio.level(100);
  expectGain(studio.gainEvents.at(-1).value, 0.9, 'live 100%');
  studio.level(0);
  expectGain(studio.gainEvents.at(-1).value, 0, 'live mute');
  studio.level(70);
  studio.playPause();
  expectGain(studio.gainEvents.at(-1).value, 0, 'pause');
  const pausedEvents = studio.gainEvents.length;
  studio.level(25);
  expectGain(studio.gainEvents.length, pausedEvents, 'changing level while paused preserves its fade');
  studio.playPause();
  expectGain(studio.gainEvents.at(-1).value, 0.9 * 0.25 ** 1.6, 'resume at 25%');
  const audible = await studio.render();
  for (let ch = 0; ch < audible.numberOfChannels; ch++) {
    const peak = audible.getChannelData(ch).reduce((max, x) => Math.max(max, Math.abs(x)), 0);
    if (!(peak > 0 && peak < 1)) throw new Error('unexpected peak at 25%: ' + peak);
  }
  studio.close();

  const muted = await openStudio('0');
  muted.playPause();
  expectGain(muted.gainEvents.at(-1).value, 0, 'first play at saved 0%');
  muted.playPause();
  muted.playPause();
  expectGain(muted.gainEvents.at(-1).value, 0, 'resume while muted');
  const audio = await muted.render();
  for (let ch = 0; ch < audio.numberOfChannels; ch++)
    if (audio.getChannelData(ch).some(s => s !== 0)) throw new Error('mute produced nonzero samples');
  muted.close();

  const interrupted = await openStudio('70');
  const moveWallClock = interrupted.controlTimers();
  interrupted.playPause();
  await interrupted.advanceAudio(0.5);
  interrupted.playPause();
  await interrupted.advanceAudio(0.625);
  moveWallClock(125);
  const duringFade = interrupted.gain();
  if (!(duringFade > 0.1)) throw new Error('test did not interrupt a nonzero pause fade');
  interrupted.playPause();
  await interrupted.advanceAudio(0.66);
  const resumed = interrupted.gain();
  if (!(resumed >= duringFade - 0.005 && resumed < duringFade + 0.04))
    throw new Error('resume jumped from ' + duringFade + ' to ' + resumed);
  moveWallClock(160);
  interrupted.playPause();
  moveWallClock(620);
  expectGain(interrupted.suspensions(), 0, 'earlier pause timer must not suspend during a later fade');
  moveWallClock(780);
  expectGain(interrupted.suspensions(), 1, 'latest pause timer suspends once');
  interrupted.close();

  localStorage.setItem('entrain.cue', 'bell');
  localStorage.setItem('entrain.duration', '1s');
  localStorage.setItem('entrain.cueVolume', '50');
  localStorage.setItem('entrain.cueInterval', '731');
  const mix = await openStudio(null, 'rain');
  const source = mix.document.querySelector('#mix-source').value;
  if (!source.includes('cue_volume_percent = 50') || !source.includes('cue_interval_ms = 731'))
    throw new Error('exported cue controls do not match the preview');
  mix.playPause();
  const state = mix.document.querySelector('#scope-state');
  const deadline = performance.now() + 8000;
  while (state.textContent === 'LOADING' && performance.now() < deadline)
    await new Promise(resolve => setTimeout(resolve, 25));
  if (state.textContent !== 'PLAYING') throw new Error('rain and bell preview did not load');
  expectGain(mix.cueHits.length, 2, 'one second schedules two 731 ms cues');
  for (let n = 0; n < mix.cueHits.length; n++) {
    const [when, offset] = mix.cueHits[n];
    expectGain(Math.round(when * 44100), Math.ceil(n * 731 * 44100 / 1000), 'cue onset');
    expectGain(Math.round(offset * 44100), Math.ceil((n % 16) * 625 * 44100 / 1000), 'source strike');
  }
  const preview = await mix.render();
  for (let ch = 0; ch < preview.numberOfChannels; ch++) {
    const samples = preview.getChannelData(ch);
    if (!samples.subarray(0, 44100).some(x => Math.abs(x) > 0.001)) throw new Error('silent preview');
    if (samples.subarray(44100).some(x => x !== 0)) throw new Error('preview exceeded file duration');
  }
  expectGain(mix.cueDisconnects(), 0, 'natural-ended cue sources leave the running audio graph intact');
  // Enter an excerpt in the middle of an alternating strike, then cross a
  // dry gap and a second section. Use a simple stereo test signal so the
  // absolute time, ear, gain and taper can each be verified by sample.
  const rate = 44100, off = new OfflineAudioContext(2, rate, rate);
  const strikes = off.createBuffer(2, 10 * rate, rate);
  for (let n = 0; n < 16; n++)
    strikes.getChannelData(n % 2).fill(1, Math.ceil(n * .625 * rate), Math.ceil((n + 1) * .625 * rate));
  const start = .7, anchor = .1;
  const sections = [
    {start:0, length:900, cue:'bell', volume:80, interval:625, fadeIn:0, fadeOut:200},
    {start:1100, length:400, cue:'bell', volume:40, interval:625, fadeIn:150, fadeOut:150}
  ];
  const {Timeline} = mix.document.defaultView.EntrainEditor;
  new Timeline(off, off.destination, sections, new Map([['bell', strikes]]), start, 1.5, anchor - start);
  const timed = await off.startRendering();
  function taper(x) { return (1 - Math.cos(Math.PI * Math.min(1, Math.max(0, x)))) / 2; }
  for (let f = 0; f < rate; f++) {
    const at = f + Math.round((start - anchor) * rate);
    let left = 0, right = 0;
    if (f >= Math.round(anchor * rate) && at < rate * .9)
      right = .8 * taper((Math.round(.9 * rate) - at - 1) / Math.round(.2 * rate));
    if (at >= Math.round(1.1 * rate) && at < 1.5 * rate)
      left = .4 * taper(Math.min(at - Math.round(1.1 * rate), 1.5 * rate - at - 1) / Math.round(.15 * rate));
    expectGain(timed.getChannelData(0)[f], left, 'timed left frame ' + f);
    expectGain(timed.getChannelData(1)[f], right, 'timed right frame ' + f);
  }
  const doc = mix.document;
  const value = (selector, text) => {
    const field = doc.querySelector(selector);
    field.value = text;
    field.dispatchEvent(new mix.document.defaultView.Event('input'));
  };
  doc.querySelector('[data-length="15m"]').click();
  if (!doc.querySelector('#mix-source').value.includes('duration = "15m"')) throw Error('duration preset');
  doc.querySelector('[data-length="custom"]').click();
  value('#mix-duration', '2m5s');
  if (!doc.querySelector('#mix-source').value.includes('duration = "125s"')) throw Error('custom duration');
  const edited = '# hand-authored comment\n' + doc.querySelector('#mix-source').value.replace('"125s"', '"42s"');
  value('#mix-source', edited);
  doc.querySelector('#apply-source').click();
  async function waitForText(text) {
    const end = performance.now() + 5000;
    while (!doc.querySelector('#document-status').textContent.includes(text)) {
      if (performance.now() >= end) throw Error(doc.querySelector('#document-status').textContent || text);
      await new Promise(resolve => setTimeout(resolve, 15));
    }
  }
  await waitForText('Source applied');
  if (doc.querySelector('#mix-source').value !== edited || doc.querySelector('#mix-duration').value !== '42s') throw Error('apply lost text or duration');
  const invalid = edited + '\nunknown_field = 1\n';
  value('#mix-source', invalid);
  doc.querySelector('#apply-source').click();
  await waitForText('Could not apply source');
  doc.querySelector('[data-length="30m"]').click();
  if (doc.querySelector('#mix-source').value !== invalid || doc.querySelector('#mix-download').disabled) throw Error('invalid edited draft lost');
  doc.querySelector('#use-controls').click();
  doc.querySelector('#confirm-control-source').click();
  if (!doc.querySelector('#mix-source').value.includes('duration = "30m"')) throw Error('explicit return to form');
  mix.close();
  document.querySelector('#result').textContent = 'PASS';
} catch (error) {
  document.querySelector('#result').textContent = 'FAIL ' + error.message;
  throw error;
} finally {
  for (const [key, value] of saved)
    if (value === null) localStorage.removeItem(key);
    else localStorage.setItem(key, value);
}
</script>
